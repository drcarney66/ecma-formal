# test262 configuration of the full suite: every directory of test/ except intl402 (ECMA-402) and staging
# (tests not yet reviewed), every flag (async and module tests run), and every
# feature of the pinned ECMA-262 (external/ecma262). The annexB tests run
# on the web-browser host (Annex B, Host.isWebBrowser), a CanBlockIsTrue test
# on a host whose agent can block (INTERPRETING.md); every other test runs on
# the default host. Read by crates/test262-runner.

[paths]
annexB
built-ins
harness
language

[web-browser-paths]
annexB
# Outside annexB, B.1.2 RegExp syntax (/\X/, /\x/, /\k<x>/ without groups); documents it only: jssearch reads annexB/ alone
built-ins/String/prototype/split/separator-regexp.js

[features]
*

[skip-features]
# Proposals (features.txt, "Proposed language features") that are not part
# of the pinned ECMA-262.
Intl.Era-monthcode
Intl.Locale-info
Intl.NumberFormat-v3
legacy-regexp
ShadowRealm
decorators
source-phase-imports
source-phase-imports-module-source
export-defer
import-text
immutable-arraybuffer
import-bytes
nonextensible-applies-to-private
await-dictionary
error-stack-accessor
# Listed as standard by test262 but not in the pinned ECMA-262: Temporal.
Temporal
# ECMA-402 (Intl) features.
canonical-tz
Intl-enumeration
intl-normative-optional
Intl.DateTimeFormat-datetimestyle
Intl.DateTimeFormat-dayPeriod
Intl.DateTimeFormat-extend-timezonename
Intl.DateTimeFormat-formatRange
Intl.DateTimeFormat-fractionalSecondDigits
Intl.DisplayNames
Intl.DisplayNames-v2
Intl.DurationFormat
Intl.ListFormat
Intl.Locale
Intl.NumberFormat-unified
Intl.RelativeTimeFormat
Intl.Segmenter
# An implementation extension the specification permits but does not define
# (a non-strict function's "caller", §17.1).
caller
