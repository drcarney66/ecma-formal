# test262 on ecma-run: the whole suite, run only when the user asks:
#   python3 scripts/test262.py run --stage suite --full --scheduled
# Otherwise its pending tests in chunks: test262.py plan --stage suite, then run --chunk I/M
# (only once tests/expected/suite/<mode>.txt exists: without it every test is pending).
# full.conf's directories and features, with staging (but staging/sm, SpiderMonkey's); intl402 is
# ECMA-402. [web-browser-paths] run on the web-browser host (`--web-browser`).

[paths]
annexB
built-ins
harness
language
staging

[exclude]
staging/sm
# Known fail, a stale test: B.3.2.1 hoists `function arguments() {}` (decisions.md annexb-block-function-arguments).
annexB/language/function-code/block-decl-func-skip-arguments.js

[web-browser-paths]
annexB
# Outside annexB, B.1.2 RegExp syntax (/\X/, /\x/, /\k<x>/ without groups), early errors without Annex B:
built-ins/String/prototype/split/separator-regexp.js
# B.3.2.1 with `arguments`, named by regress.txt (staging/sm is excluded):
staging/sm/lexical-environment/block-scoped-functions-annex-b-arguments.js

[features]
*

[skip-features]
# Proposals (features.txt, "Proposed language features") that are not part
# of the pinned ECMA-262.
Intl.Era-monthcode
Intl.Locale-info
Intl.NumberFormat-v3
legacy-regexp
ShadowRealm
decorators
source-phase-imports
source-phase-imports-module-source
export-defer
import-text
immutable-arraybuffer
import-bytes
nonextensible-applies-to-private
await-dictionary
error-stack-accessor
# Listed as standard by test262 but not in the pinned ECMA-262: Temporal.
Temporal
# ECMA-402 (Intl) features.
canonical-tz
Intl-enumeration
intl-normative-optional
Intl.DateTimeFormat-datetimestyle
Intl.DateTimeFormat-dayPeriod
Intl.DateTimeFormat-extend-timezonename
Intl.DateTimeFormat-formatRange
Intl.DateTimeFormat-fractionalSecondDigits
Intl.DisplayNames
Intl.DisplayNames-v2
Intl.DurationFormat
Intl.ListFormat
Intl.Locale
Intl.NumberFormat-unified
Intl.RelativeTimeFormat
Intl.Segmenter
# An implementation extension the specification permits but does not define
# (a non-strict function's "caller", §17.1).
caller
